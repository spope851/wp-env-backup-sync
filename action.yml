name: WordPress Environment Backup Sync
description: Synchronize WordPress environments with backup and database migration support
branding:
  icon: 'refresh-cw'  
  color: 'white'      

inputs:
  source_env:
    description: 'Source environment name (e.g., release, staging, development). Required if source_path and source_domain are not provided.'
    required: false
    type: string
  target_env:
    description: 'Target environment name (e.g., staging, production). Required if target_path and target_domain are not provided.'
    required: false
    type: string
  base_path:
    description: 'Base path for WordPress installations. Required if source_path and target_path are not provided.'
    required: false
    type: string
  domain:
    description: 'Base domain for the WordPress sites. Required if source_domain and target_domain are not provided.'
    required: false
    type: string
  ssh_host:
    description: 'SSH host'
    required: true
    type: string
  ssh_username:
    description: 'SSH username'
    required: true
    type: string
  ssh_private_key:
    description: 'SSH private key'
    required: true
    type: string
  ssh_known_hosts:
    description: 'SSH known hosts'
    required: true
    type: string
  ssh_key_type:
    description: 'SSH key type (e.g., id_rsa)'
    required: true
    type: string
  ssh_port:
    description: 'SSH port'
    required: true
    type: string
    default: '22'
  encryption_password:
    description: 'Password for encrypting backup files'
    required: true
    type: string
  github_token:
    description: 'GitHub token for pushing changes'
    required: true
    type: string
  skip_tables:
    description: 'Comma-separated list of tables to skip during search-replace. Use empty string to skip no tables.'
    required: false
    type: string
    default: 'wp_comments,wp_commentmeta'
  clear_cache_commands:
    description: 'Comma-separated list of cache clear commands to run (flush,transients,rewrite,litespeed). Use empty string to skip cache clearing.'
    required: false
    type: string
    default: 'flush,transients,rewrite'
  sync_content_dirs:
    description: 'Comma-separated list of wp-content directories or files to sync (e.g., themes,plugins,uploads,languages,mu-plugins,custom-file.php). Use empty string to skip content sync.'
    required: false
    type: string
    default: 'themes,plugins,uploads,mu-plugins'
  encryption_algorithm:
    description: 'OpenSSL encryption algorithm to use for backups'
    required: false
    type: string
    default: 'aes-256-cbc'
  encryption_iterations:
    description: 'Number of PBKDF2 iterations for backup encryption'
    required: false
    type: string
    default: '100000'
  target_path:
    description: 'Direct target path override. If not provided, will be constructed from base_path and target_env.'
    required: false
    type: string
  target_domain:
    description: 'Direct target domain override. If not provided, will be constructed from target_env and domain.'
    required: false
    type: string
  source_path:
    description: 'Direct source path override. If not provided, will be constructed from base_path and source_env.'
    required: false
    type: string
  source_domain:
    description: 'Direct source domain override. If not provided, will be constructed from source_env and domain.'
    required: false
    type: string

runs:
  using: "composite"
  steps:
    - name: Install SSH key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ inputs.ssh_private_key }}
        known_hosts: ${{ inputs.ssh_known_hosts }}
        name: ${{ inputs.ssh_key_type }}

    - name: Set environment variables
      shell: bash
      run: |
        # Validate required inputs
        if [ -z "${{ inputs.source_path }}" ] && [ -z "${{ inputs.source_env }}" ]; then
          echo "Error: Either source_path or source_env must be provided"
          exit 1
        fi
        if [ -z "${{ inputs.target_path }}" ] && [ -z "${{ inputs.target_env }}" ]; then
          echo "Error: Either target_path or target_env must be provided"
          exit 1
        fi
        if [ -z "${{ inputs.source_path }}" ] && [ -z "${{ inputs.target_path }}" ] && [ -z "${{ inputs.base_path }}" ]; then
          echo "Error: base_path is required when using environment-based paths"
          exit 1
        fi
        if [ -z "${{ inputs.source_domain }}" ] && [ -z "${{ inputs.target_domain }}" ] && [ -z "${{ inputs.domain }}" ]; then
          echo "Error: domain is required when using environment-based domains"
          exit 1
        fi

        # Set target path and domain
        if [ -n "${{ inputs.target_path }}" ]; then
          echo "TARGET_PATH=${{ inputs.target_path }}" >> $GITHUB_ENV
        else
          if [ "${{ inputs.target_env }}" = "production" ]; then
            echo "TARGET_PATH=${{ inputs.base_path }}" >> $GITHUB_ENV
          else
            echo "TARGET_PATH=${{ inputs.base_path }}/${{ inputs.target_env }}" >> $GITHUB_ENV
          fi
        fi

        if [ -n "${{ inputs.target_domain }}" ]; then
          echo "TARGET_DOMAIN=${{ inputs.target_domain }}" >> $GITHUB_ENV
        else
          if [ "${{ inputs.target_env }}" = "production" ]; then
            echo "TARGET_DOMAIN=${{ inputs.domain }}" >> $GITHUB_ENV
          else
            echo "TARGET_DOMAIN=${{ inputs.target_env }}.${{ inputs.domain }}" >> $GITHUB_ENV
          fi
        fi

        # Set source path and domain
        if [ -n "${{ inputs.source_path }}" ]; then
          echo "SOURCE_PATH=${{ inputs.source_path }}" >> $GITHUB_ENV
        else
          echo "SOURCE_PATH=${{ inputs.base_path }}/${{ inputs.source_env }}" >> $GITHUB_ENV
        fi

        if [ -n "${{ inputs.source_domain }}" ]; then
          echo "SOURCE_DOMAIN=${{ inputs.source_domain }}" >> $GITHUB_ENV
        else
          echo "SOURCE_DOMAIN=${{ inputs.source_env }}.${{ inputs.domain }}" >> $GITHUB_ENV
        fi

    - name: Enable Maintenance Mode
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ inputs.ssh_host }}
        username: ${{ inputs.ssh_username }}
        key: ${{ inputs.ssh_private_key }}
        port: ${{ inputs.ssh_port }}
        script: |
          wp maintenance-mode activate --path=${{ env.TARGET_PATH }}

    # WP-Content
    - name: Sync Content
      if: inputs.sync_content_dirs != ''
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ inputs.ssh_host }}
        username: ${{ inputs.ssh_username }}
        key: ${{ inputs.ssh_private_key }}
        port: ${{ inputs.ssh_port }}
        script: |
          for item in $(echo "${{ inputs.sync_content_dirs }}" | tr ',' ' '); do
            SOURCE_ITEM="${{ env.SOURCE_PATH }}/wp-content/$item"
            
            # Check if item doesn't exist
            if [ ! -e "$SOURCE_ITEM" ]; then
              echo "Warning: $item not found in source wp-content directory"
              continue
            fi
            
            # Handle file
            if [ -f "$SOURCE_ITEM" ]; then
              cp -f "$SOURCE_ITEM" "${{ env.TARGET_PATH }}/wp-content/$item"
            # Handle directory
            elif [ -d "$SOURCE_ITEM" ]; then
              rsync -avz --delete "$SOURCE_ITEM/" "${{ env.TARGET_PATH }}/wp-content/$item/"
            fi
          done

    # Database Content
    - name: Export Target Backup
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ inputs.ssh_host }}
        username: ${{ inputs.ssh_username }}
        key: ${{ inputs.ssh_private_key }}
        port: ${{ inputs.ssh_port }}
        script: |
          wp db export ${{ env.TARGET_PATH }}/backup.sql \
          --all-tables \
          --path=${{ env.TARGET_PATH }}

    - name: Content Segmentation
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ inputs.ssh_host }}
        username: ${{ inputs.ssh_username }}
        key: ${{ inputs.ssh_private_key }}
        port: ${{ inputs.ssh_port }}
        script: |
          wp search-replace "${{ env.SOURCE_DOMAIN }}" "${{ env.TARGET_DOMAIN }}" \
          --all-tables \
          --export=${{ env.TARGET_PATH }}/migration.sql \
          --path=${{ env.SOURCE_PATH }} \
          --skip-columns=guid \
          --skip-tables=${{ inputs.skip_tables }}
          
    - name: Import Source Migration to Target
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ inputs.ssh_host }}
        username: ${{ inputs.ssh_username }}
        key: ${{ inputs.ssh_private_key }}
        port: ${{ inputs.ssh_port }}
        script: |
          wp db import ${{ env.TARGET_PATH }}/migration.sql --path=${{ env.TARGET_PATH }}

    - name: Disable Maintenance Mode
      if: always()  # Ensures this runs even after rollback
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ inputs.ssh_host }}
        username: ${{ inputs.ssh_username }}
        key: ${{ inputs.ssh_private_key }}
        port: ${{ inputs.ssh_port }}
        script: |
          wp maintenance-mode deactivate --path=${{ env.TARGET_PATH }}

    # Clear cache in target environment
    - name: Clear Cache in Target
      if: inputs.clear_cache_commands != ''
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ inputs.ssh_host }}
        username: ${{ inputs.ssh_username }}
        key: ${{ inputs.ssh_private_key }}
        port: ${{ inputs.ssh_port }}
        script: |
          for cmd in $(echo "${{ inputs.clear_cache_commands }}" | tr ',' ' '); do
            case $cmd in
              "flush")
                wp cache flush --path=${{ env.TARGET_PATH }}
                ;;
              "transients")
                wp transient delete --all --path=${{ env.TARGET_PATH }}
                ;;
              "rewrite")
                wp rewrite flush --hard --path=${{ env.TARGET_PATH }}
                ;;
              "litespeed")
                # Check if LiteSpeed Cache plugin is active before attempting to purge
                if wp plugin is-active litespeed-cache --path=${{ env.TARGET_PATH }}; then
                  wp litespeed-purge all --path=${{ env.TARGET_PATH }}
                fi
                ;;
            esac
          done

    # Artifact handling steps
    ## Backup
    - name: Compress Target Backup
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ inputs.ssh_host }}
        username: ${{ inputs.ssh_username }}
        key: ${{ inputs.ssh_private_key }}
        port: ${{ inputs.ssh_port }}
        script: |
          cd ${{ env.TARGET_PATH }}
          gzip -f backup.sql

    - name: Encrypt Target Backup
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ inputs.ssh_host }}
        username: ${{ inputs.ssh_username }}
        key: ${{ inputs.ssh_private_key }}
        port: ${{ inputs.ssh_port }}
        script: |
          cd ${{ env.TARGET_PATH }}
          PASS='${{ inputs.encryption_password }}'
          openssl enc -${{ inputs.encryption_algorithm }} -iter ${{ inputs.encryption_iterations }} -pbkdf2 -salt \
            -in backup.sql.gz \
            -out backup.sql.gz.enc \
            -pass "pass:${PASS}"
        
    - name: Transfer Target Backup to GitHub Runner
      shell: bash
      run: |
        eval `ssh-agent -s`
        ssh-add ~/.ssh/${{ inputs.ssh_key_type }}
        ssh-keyscan -p ${{ inputs.ssh_port }} -H ${{ inputs.ssh_host }} >> ~/.ssh/known_hosts
        scp -P ${{ inputs.ssh_port }} ${{ inputs.ssh_username }}@${{ inputs.ssh_host }}:${{ env.TARGET_PATH }}/backup.sql.gz.enc ./backup/${{ inputs.target_env }}/$(date +%Y-%m-%d-%H-%M-%S).sql.gz.enc

    ## Migration
    - name: Compress Source Migration
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ inputs.ssh_host }}
        username: ${{ inputs.ssh_username }}
        key: ${{ inputs.ssh_private_key }}
        port: ${{ inputs.ssh_port }}
        script: |
          cd ${{ env.TARGET_PATH }}
          gzip -f migration.sql

    - name: Encrypt Source Migration
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ inputs.ssh_host }}
        username: ${{ inputs.ssh_username }}
        key: ${{ inputs.ssh_private_key }}
        port: ${{ inputs.ssh_port }}
        script: |
          cd ${{ env.TARGET_PATH }}
          PASS='${{ inputs.encryption_password }}'
          openssl enc -aes-256-cbc -iter 100000 -pbkdf2 -salt \
            -in migration.sql.gz \
            -out migration.sql.gz.enc \
            -pass "pass:${PASS}"

    - name: Transfer Source Migration to GitHub Runner
      shell: bash
      run: |
        eval `ssh-agent -s`
        ssh-add ~/.ssh/${{ inputs.ssh_key_type }}
        ssh-keyscan -p ${{ inputs.ssh_port }} -H ${{ inputs.ssh_host }} >> ~/.ssh/known_hosts
        scp -P ${{ inputs.ssh_port }} ${{ inputs.ssh_username }}@${{ inputs.ssh_host }}:${{ env.TARGET_PATH }}/migration.sql.gz.enc ./migration/${{ inputs.target_env }}/$(date +%Y-%m-%d-%H-%M-%S).sql.gz.enc

    - name: Configure Git and Push Changes
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "backup ${{ inputs.target_env }} and sync with ${{ inputs.source_env }}"
        git push origin HEAD:${{ github.ref }}
